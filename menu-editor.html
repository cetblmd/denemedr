}
.me-drag-bad{

:root{
  --micro-w: 30px;
  --micro-h: 16px;

  --active-width: 380px;
  --cell-h: 64px;
  --cell-w: 120px; 
  --grid-pad: 0px;
  --grid-rows: 40;
}

body{
  font-family: system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  background:#f2f4f7;
  padding:20px;
}


html, body{ overflow-x:hidden; }
.menu-body, .active, .pool{ min-width:0; }
.menu-body{ min-height:0; }

.menu-editor{
  background:#fff;
  border:1px solid #ccc;
  border-radius:10px;
  padding:14px;
  max-width:1600px;
  margin:auto;
}

.menu-body{
  display:grid;
  grid-template-columns: var(--active-width) minmax(0, 1fr);
}


.active{
  position:relative;
  border-right:1px solid #bbb;
  background:#fafafa;
  padding:10px 10px 10px 10px;
}

.active-frame{
  flex:1;
  border:1px dashed #999;
  border-radius:10px;
  padding:0;
  background:#fff;
}

.active-grid-wrap{
  height:72vh !important;
  overflow-y: scroll !important;
  overflow-x: hidden !important;
  scrollbar-gutter: stable;
  display:block;
}

.active-frame-wrap{
  height:100%;
  min-height:0;
  display:flex;
  align-items:stretch;
  gap:10px; 
}

.active-frame{
  flex:1 1 auto;
  
}

.scroll-channel{
  width:16px;
  border-radius:10px;
  background:rgba(0,0,0,0.06);
  overflow-y:scroll;
  overflow-x:hidden;
  position:relative;
}
.scroll-channel::-webkit-scrollbar{ width:16px; }
.scroll-channel::-webkit-scrollbar-thumb{
  background:rgba(0,0,0,0.35);
  border-radius:10px;
  border:3px solid rgba(0,0,0,0.06);
}
.scroll-channel::-webkit-scrollbar-track{
  background:rgba(0,0,0,0.06);
  border-radius:10px;
}
.scroll-channel{ scrollbar-color: rgba(0,0,0,0.45) rgba(0,0,0,0.10); }

.scroll-channel{ scrollbar-width:auto; }

.scroll-spacer{ width:1px; height:0px; }


.active-grid-wrap{ scrollbar-width:none; }
.active-grid-wrap::-webkit-scrollbar{ width:0px; height:0px; }


.active-grid{
    --grid-pad:0;
position:relative;
  min-height: 200vh; 
  padding: var(--grid-pad);
  box-sizing:border-box;

  
    linear-gradient(to right, rgba(0,0,0,0.14) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(0,0,0,0.14) 1px, transparent 1px);
  border-radius:8px;
  
  background-image:
    linear-gradient(to right, rgba(0,0,0,0.10) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(0,0,0,0.10) 1px, transparent 1px);
  background-size: var(--micro-w) var(--micro-h);
  background-position: var(--grid-pad) var(--grid-pad);
  background-color: transparent;
}


.active-grid.dragover{
  outline:2px solid rgba(0,120,255,0.45);
  outline-offset:2px;
}


.placed-item{
  position:absolute;
  width: var(--tile-w, var(--cell-w));
  height: var(--tile-h, var(--cell-h));
  box-sizing:border-box;
  padding:8px 8px;
  border-radius:10px;
  border:0;
  outline:0;
  background:transparent;
  cursor:grab;
  display:flex;
  align-items: var(--tile-align-items, center);
  justify-content: var(--tile-justify, center);
  text-align: var(--tile-text-align, center);
  gap:6px;
  user-select:none;
}

.placed-item.selected{
  
  box-shadow:none !important;
}
.placed-item.selected::after{
  content:"";
  position:absolute;
  inset:0px; 
  border:2px solid rgba(255,140,0,.85);
  border-radius:10px;
  pointer-events:none;
}


.placed-item .tile-content{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  max-width:100%;
  max-height:100%;
  pointer-events:none; 
}
.placed-item .tile-content .icon,
.placed-item .tile-content .title{
  pointer-events:none;
}



.placed-item.icon-left  .tile-content{ flex-direction:row; }
.placed-item.icon-right .tile-content{ flex-direction:row-reverse; }
.placed-item.icon-top   .tile-content{ flex-direction:column; }
.placed-item.icon-bottom .tile-content{ flex-direction:column-reverse; }

.placed-item.icon-top .tile-content,
.placed-item.icon-bottom .tile-content{
  align-items:center; 
}

.placed-item.icon-top .tile-content .title,
.placed-item.icon-bottom .tile-content .title{
  white-space:normal;
  text-overflow:clip;
  overflow:hidden;
  text-align: var(--tile-text-align, center);
}






.placed-item:active{ cursor:grabbing; }

.placed-item .icon{ font-size: var(--tile-icon-size, 22px); line-height:1; color: var(--tile-icon-color, inherit); }
.placed-item .title{
  font-family: var(--tile-font-family, inherit);
  font-size: var(--tile-font-size, 12px);
  font-weight: var(--tile-font-weight, 600);
  color: var(--tile-font-color, inherit);
  line-height:1.1;
  
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}


.format-row .placed-item{
  width: calc(100% - (var(--grid-pad) * 2));
  
  justify-content: var(--tile-justify, flex-start);
  text-align: var(--tile-text-align, left);
  gap:10px;
}
.format-row .placed-item .title{
  white-space:nowrap;
}
.format-pile .format-group-pile .placed-item{
  
  gap:6px;
}

.format-group-row .placed-item{
  justify-content:flex-start;
  text-align:left;
  gap:10px;
}

#activeGrid.format-row.row-icon-only .placed-item .title{ display:none; }
#activeGrid.format-row.row-icon-only .placed-item{
  padding:8px 6px;
  justify-content:center;
  text-align:center;
}



.resize-bar{
  touch-action:none;
  position:absolute;
  top:0; right:-4px;
  width:8px; height:100%;

  background:rgba(0,0,0,0.07);

}
.resize-bar:hover{ background:rgba(0,0,0,0.16); }

}

position:relative;}
.pool-item .icon{ font-size:18px; }

.hint{

}



.drag-overlay{
  position:absolute;
  inset:0;
  pointer-events:none;
}
.drag-preview{
  position:absolute;
  width: var(--cell-w);
  height: var(--cell-h);
  box-sizing:border-box;

  
  outline:1px dashed rgba(0,0,0,0.45);

.drag-dot{

function __meStartGhostDrag(tileEl, id, clientX, clientY){

  __meDrag.offY = clientY - r.top;

  ghost.classList.add("me-drag-ghost");
  ghost.style.position = "fixed";
  ghost.style.left = r.left + "px";
  ghost.style.top  = r.top  + "px";

    if(typeof v === "object"){

      if(Object.prototype.hasOwnProperty.call(v, "mobile")) return v["mobile"];
      if(Object.prototype.hasOwnProperty.call(v, "tablet")) return v["tablet"];
      if(Object.prototype.hasOwnProperty.call(v, "pc")) return v["pc"];
      if(Object.prototype.hasOwnProperty.call(v, "desktop")) return v["desktop"];
      const ks = Object.keys(v);
      for(const k of ks){
        const vv = v[k];
        if(typeof vv === "number" || typeof vv === "string") return vv;
      }
    }
  }catch(e){}
  return v;
}

function __meCompactActivePlacements(){
  try{
    const entries = Array.from(placements.entries());
    if(!entries.length) return;

    for(const [_,pos] of entries){
      if(pos && (typeof pos.x === "number" || typeof pos.y === "number")) return;
    }

    let minR = Infinity;
    entries.forEach(([_,pos])=>{
      const r = (pos && typeof pos.r === "number") ? pos.r : 0;
      if(r < minR) minR = r;
    });
    if(!isFinite(minR) || minR <= 0) return;

    entries.forEach(([id,pos])=>{
      const r = (pos && typeof pos.r === "number") ? pos.r : 0;
      const c = (pos && typeof pos.c === "number") ? pos.c : 0;
      placements.set(id, { r: Math.max(0, r - minR), c: Math.max(0, c) });
    });
  }catch(e){ __meDbg("catch8"+e); }
}

function __meGetTileSizePx(id){
  const mode = (typeof meDeviceMode==="function") ? meDeviceMode() : "pc";
  const ds = __getDefaultTileSize();
  const st = (tileStyles && tileStyles[id]) ? tileStyles[id] : null;

  const flatW = st && (typeof st.wPx === "number") ? st.wPx : null;
  const flatH = st && (typeof st.hPx === "number") ? st.hPx : null;

  const objW = st && st.wPx && typeof st.wPx === "object" ? st.wPx[mode] : null;
  const objH = st && st.hPx && typeof st.hPx === "object" ? st.hPx[mode] : null;

  const baseW = (objW!=null ? (parseInt(objW,10) || ds.wPx) : (flatW!=null ? (parseInt(flatW,10) || ds.wPx) : ds.wPx));
  const baseH = (objH!=null ? (parseInt(objH,10) || ds.hPx) : (flatH!=null ? (parseInt(flatH,10) || ds.hPx) : ds.hPx));

  let wPx = baseW;
  let hPx = baseH;
  if(st && st.__freePx) return { wPx, hPx };
  try{
    const mw = (typeof mW === "function") ? (parseInt(mW(),10) || 1) : 1;
    const mh = (typeof mH === "function") ? (parseInt(mH(),10) || 1) : 1;
    if(mw > 0) wPx = Math.max(1, Math.ceil(baseW / mw)) * mw;
    if(mh > 0) hPx = Math.max(1, Math.ceil(baseH / mh)) * mh;
  }catch(_){}


  try{
    const mw2 = (typeof mW === "function") ? (parseInt(mW(),10) || 1) : 1;
    const mh2 = (typeof mH === "function") ? (parseInt(mH(),10) || 1) : 1;
    const rounded = (wPx!==baseW) || (hPx!==baseH);
    if(rounded){
      __meLogOnceKey("[ME][SIZE_ROUND]", {id, mode, baseW, baseH, wPx, hPx, mw: mw2, mh: mh2, st});
    }
  }catch(_){}
  return { wPx, hPx };
}

function __styleToLayerHTML(st){
  if(!st) return "";
  const bgMode = st.bgMode || "transparent";
  const shape = st.shape || "none";
  const color = st.color || "#3b82f6";
  if(bgMode === "transparent" && shape === "none") return "";
  const alpha = (bgMode === "tint") ? 0.18 : 0.0;
  const rgb = __hexToRgb(color);
  const bg = (bgMode === "tint" && rgb) ? `rgba(${rgb.r},${rgb.g},${rgb.b},${alpha})` : "transparent";
  const stroke = (rgb) ? `rgba(${rgb.r},${rgb.g},${rgb.b},0.55)` : "rgba(59,130,246,.55)";
  const cls = (shape === "circle") ? "circle" : (shape === "rect" ? "rect" : "");
  const style = `background:${bg}; border:1px solid ${stroke};`;
  if(shape === "none"){
    return `<div class="style-layer rect" style="${style}"></div>`;
  }
  return `<div class="style-layer ${cls}" style="${style}"></div>`;
}

function __hexToRgb(hex){
  try{
    if(!hex) return null;
    const h = String(hex).replace("#","").trim();
    if(h.length===3){
      const r=parseInt(h[0]+h[0],16), g=parseInt(h[1]+h[1],16), b=parseInt(h[2]+h[2],16);
      return {r,g,b};
    }
    if(h.length!==6) return null;
    const r=parseInt(h.slice(0,2),16), g=parseInt(h.slice(2,4),16), b=parseInt(h.slice(4,6),16);
    return {r,g,b};
  }catch(e){ return null; }
}

function __meStepperCenterIfNeeded(){
  if(!meStepperCard) return;
  if(meStepperCard.style.position === "fixed" && meStepperCard.style.left) return;
  const vw = window.innerWidth, vh = window.innerHeight;
  const rect = meStepperCard.getBoundingClientRect();
  const left = Math.max(8, (vw - rect.width)/2);
  const top  = Math.max(8, (vh - rect.height)/2);
  meStepperCard.style.position = "fixed";
  meStepperCard.style.left = left + "px";

    __meStepperDrag.dx = e.clientX - rect.left;
    __meStepperDrag.dy = e.clientY - rect.top;
    try{ meStepperTitle.setPointerCapture(e.pointerId); }catch(_){}
    e.preventDefault();
  });

  window.addEventListener("pointermove", (e)=>{
    if(!__meStepperDrag.active) return;

    let left = e.clientX - __meStepperDrag.dx;

    try{ meStepperTitle.releasePointerCapture(e.pointerId); }catch(_){}
  };
  window.addEventListener("pointerup", __end, {passive:true});
  window.addEventListener("pointercancel", __end, {passive:true});
}

function __meClientToMicro(clientX, clientY, offx, offy){
  const scaleX0 = (typeof getScaleX==="function") ? getScaleX() : 1;
  const scaleY0 = (typeof getScaleY==="function") ? getScaleY() : 1;
  const scaleX = scaleX0||1;
  const scaleY = scaleY0||1;
  const adjOffX = (offx||0) / (scaleX||1);
  const adjOffY = (offy||0) / (scaleY||1);
  const hasDragOffset = ((offx||0)!==0) || ((offy||0)!==0);
  const p = (typeof pad==="function") ? (pad()||0) : 0;

  const dbg = (function(){
    try{
      if(window.__ME_DRAG_DEBUG) return true;
      return (localStorage && localStorage.getItem && localStorage.getItem("ME_DRAG_DEBUG")==="1");
    }catch(_){ return false; }
  })();

  function log(tag, o){
    if(!dbg) return;
    try{
      window.__ME_DRAG_DEBUG_LAST = window.__ME_DRAG_DEBUG_LAST || 0;
      const now = Date.now();
      if(now - window.__ME_DRAG_DEBUG_LAST < 120) return;
      window.__ME_DRAG_DEBUG_LAST = now;
      console.log(tag, o);
    }catch(_){}
  }

  try{
    if(!hasDragOffset && window.DRHB && typeof DRHB.clientToPx==="function"){
      const pp = DRHB.clientToPx(clientX, clientY);
      const out0 = { x: (pp.x - adjOffX), y: (pp.y - adjOffY), r: 0, c: 0 };
      log("[ME][C2M][DRHB]", {clientX, clientY, offx, offy, adjOffX, adjOffY, scaleX, scaleY, pad:p, pp, out:out0});
      return { x: Math.max(0,out0.x), y: Math.max(0,out0.y), r: 0, c: 0 };
    }
  }catch(e){
    log("[ME][C2M][DRHB][ERR]", e);
  }

  try{
    const sx = (gridWrap && gridWrap.scrollLeft) ? gridWrap.scrollLeft : 0;
    const sy = (gridWrap && gridWrap.scrollTop ) ? gridWrap.scrollTop  : 0;

    if(hasDragOffset && grid && typeof grid.getBoundingClientRect==="function"){
      const gr = grid.getBoundingClientRect();
      const cl = (grid && grid.clientLeft) ? grid.clientLeft : 0;
      const ct = (grid && grid.clientTop ) ? grid.clientTop  : 0;
      const x = (((clientX - gr.left - cl) ) / scaleX) - adjOffX - p;
      const y = (((clientY - gr.top  - ct) ) / scaleY) - adjOffY - p;
      const out1 = { x: Math.max(0,x), y: Math.max(0,y), r: 0, c: 0 };
      log("[ME][C2M][GRIDRECT]", {clientX, clientY, offx, offy, adjOffX, adjOffY, scaleX, scaleY, pad:p, gr:{left:gr.left, top:gr.top, w:gr.width, h:gr.height}, cl, ct, sx, sy, out:out1});
      return out1;
    }

    if(gridWrap && typeof gridWrap.getBoundingClientRect==="function"){
      const wr = gridWrap.getBoundingClientRect();
      const clw = (gridWrap && gridWrap.clientLeft) ? gridWrap.clientLeft : 0;
      const ctw = (gridWrap && gridWrap.clientTop ) ? gridWrap.clientTop  : 0;
      const x = (((clientX - wr.left - clw) + sx) / scaleX) - adjOffX - p;
      const y = (((clientY - wr.top  - ctw) + sy) / scaleY) - adjOffY - p;
      const out2 = { x: Math.max(0,x), y: Math.max(0,y), r: 0, c: 0 };
      log("[ME][C2M][WRAPRECT]", {clientX, clientY, offx, offy, adjOffX, adjOffY, scaleX, scaleY, pad:p, wr:{left:wr.left, top:wr.top, w:wr.width, h:wr.height}, sx, sy, clw, ctw, out:out2});
      return out2;
    }

    if(grid && typeof grid.getBoundingClientRect==="function"){
      const gr = grid.getBoundingClientRect();
      const cl = (grid && grid.clientLeft) ? grid.clientLeft : 0;
      const ct = (grid && grid.clientTop ) ? grid.clientTop  : 0;
      const x = (((clientX - gr.left - cl) ) / scaleX) - adjOffX - p;
      const y = (((clientY - gr.top  - ct) ) / scaleY) - adjOffY - p;
      const out3 = { x: Math.max(0,x), y: Math.max(0,y), r: 0, c: 0 };
      log("[ME][C2M][GRIDRECT2]", {clientX, clientY, offx, offy, adjOffX, adjOffY, scaleX, scaleY, pad:p, gr:{left:gr.left, top:gr.top, w:gr.width, h:gr.height}, cl, ct, out:out3});
      return out3;
    }
  }catch(e){
    log("[ME][C2M][ERR]", e);
  }

  return { x:0, y:0, r:0, c:0 };
}

function canPlaceGroup(anchorId, targetR, targetC){
  const base = placements.get(anchorId);
  if(!base) return false;
  const dR = targetR - base.r;
  const dC = targetC - base.c;

  const moving = (selectedIds.size && selectedIds.has(anchorId)) ? selectedIds : new Set([anchorId]);

  const occ = new Set();
  for(const [id,pos] of placements.entries()){
    if(moving.has(id)) continue;
    const spanR = tileSpanR(id);
    const spanC = tileSpanC(id);
    for(let rr=pos.r; rr<pos.r+spanR; rr++){
      for(let cc=pos.c; cc<pos.c+spanC; cc++){
        occ.add(rr+"|"+cc);
      }
    }
  }

  for(const id of moving){
    const pos = placements.get(id);
    if(!pos) continue;
    const nr = pos.r + dR;
    const nc = pos.c + dC;
    if(nr < 0 || nc < 0) return false;
    const spanR = tileSpanR(id);
    const spanC = tileSpanC(id);
    for(let rr=nr; rr<nr+spanR; rr++){
      for(let cc=nc; cc<nc+spanC; cc++){
        if(occ.has(rr+"|"+cc)) return false;
      }
    }
  }
  return true;
}

function placeGroupAt(anchorId, targetR, targetC){

  for(const id of moving){
    const pos = placements.get(id);
    if(!pos) continue;
    placements.set(id, {r: pos.r + dR, c: pos.c + dC});
  }
return true;
}

function canMoveSelectionBy(dr, dc){
  if(!selectedIds || selectedIds.size === 0) return false;

  const moving = new Set(selectedIds);
  const mc = calcMicroCols();

  const occ = new Set();
  for(const [id,pos] of placements.entries()){
    if(moving.has(id)) continue;
    const spanR = tileSpanR(id);
    const spanC = tileSpanC(id);
    for(let rr=pos.r; rr<pos.r+spanR; rr++){
      for(let cc=pos.c; cc<pos.c+spanC; cc++){
        occ.add(rr+"|"+cc);
      }
    }
  }

  for(const id of moving){
    const pos = placements.get(id);
    if(!pos) continue;

    const spanR = tileSpanR(id);
    const spanC = tileSpanC(id);

    const nr = pos.r + dr;
    const nc = pos.c + dc;

    if(nr < 0 || nc < 0) return false;
    if(nc > (mc - spanC)) return false; // keep within visible micro cols

    for(let rr=nr; rr<nr+spanR; rr++){
      for(let cc=nc; cc<nc+spanC; cc++){
        if(occ.has(rr+"|"+cc)) return false;
      }
    }
  }
  return true;
}

function occupiedMicroSet(exceptId=null){
  const s = new Set();
  for(const [id,pos] of placements.entries()){
    if(exceptId && id===exceptId) continue;
    const spanR = tileSpanR(id);
    const spanC = tileSpanC(id);
    for(let dr=0; dr<spanR; dr++){
      for(let dc=0; dc<spanC; dc++){
        s.add((pos.r+dr)+":"+(pos.c+dc));
      }
    }
  }
  return s;
}
function canPlace(id, r, c){
  const occ = occupiedMicroSet(id);
  const spanR = tileSpanR(id);
  const spanC = tileSpanC(id);
  for(let dr=0; dr<spanR; dr++){
    for(let dc=0; dc<spanC; dc++){
      if(occ.has((r+dr)+":"+(c+dc))) return false;
    }
  }

  try{
    const mode = (typeof meDeviceMode==="function") ? meDeviceMode() : "pc";
    const stA = __getStyleFor(id) || {};
    const WA = (stA && stA.wPx) ? (typeof stA.wPx==="object" ? (stA.wPx[mode]||cellW()) : stA.wPx) : cellW();
    const HA = (stA && stA.hPx) ? (typeof stA.hPx==="object" ? (stA.hPx[mode]||cellH()) : stA.hPx) : cellH();

    const AL = c * mW(), AT = r * mH(), AR = AL + WA, AB = AT + HA;

    for(const [oid, pos] of placements.entries()){
      if(oid===id) continue;

      const stB = __getStyleFor(oid) || {};
      const WB = (stB && stB.wPx) ? (typeof stB.wPx==="object" ? (stB.wPx[mode]||cellW()) : stB.wPx) : cellW();
      const HB = (stB && stB.hPx) ? (typeof stB.hPx==="object" ? (stB.hPx[mode]||cellH()) : stB.hPx) : cellH();

      const BL = pos.c * mW(), BT = pos.r * mH(), BR = BL + WB, BB = BT + HB;

      const intersects = !(AR <= BL || AL >= BR || AB <= BT || AT >= BB);
      if(intersects) return false;
    }
  }catch(e){  }

  return true;
}

function __reflowPlacementsToSingleColumn(){

  const spanR = microSpanR(); // 1 tile height in micro rows (usually 4)

  const entries = [...placements.entries()].map(([id, pos]) => ({ id, pos }));
  entries.sort((a,b) => (a.pos.r - b.pos.r) || (a.pos.c - b.pos.c) || (a.id > b.id ? 1 : -1));

  for(const e of entries){

    r += (spanR + gapMicro);
  }

function calcMicroCols(){
  if(isRow()) return 4; // satır modunda hizalama sınırlı

  let usable;
  try{
    if(typeof __meIsMobile !== "undefined" && __meIsMobile && gridWrap){
      usable = Math.max(80, gridWrap.clientWidth - pad()*2);
    }else{
      usable = Math.max(80, activeWidth() - pad()*2 - 30);
    }
  }catch(e){
    usable = Math.max(80, activeWidth() - pad()*2 - 30);
  }

  const step = Math.max(1, mW());
  const mc = Math.max(1, Math.floor((usable + step - 1) / step)); // ceil(usable/step)
  return mc;
}
function clampMicroToFit(r,c){
  const mc = calcMicroCols();
  c = Math.min(c, Math.max(0, mc - 4)); // item occupies 4 micro cols
  r = Math.max(0, r);
  return {r,c};
}

function snapXToBoundary(x, step){
  return Math.round(x / step) * step;
}
function snapYToBoundary(y, step){
  return Math.round(y / step) * step;
}

function microTopLeftFromEvent(ev, offx, offy){
  const rect = grid.getBoundingClientRect();
  const p = pad();
  const sx = gridWrap.scrollLeft;
  const sy = gridWrap.scrollTop;

  const x= (ev.clientX - rect.left - p) + sx - offx;
  const y= (ev.clientY - rect.top  - p) + sy - offy;

  const snapX = snapXToBoundary(Math.max(0, x), mW());
  const snapY = snapYToBoundary(Math.max(0, y), mH());

  const c = Math.max(0, Math.round(snapX / mW()));
  const r = Math.max(0, Math.round(snapY / mH()));
  return {r,c};
}

(function(){
  const grid = document.getElementById("activeGrid");
  if(!grid) return;

  let selOn = false;
  let sx = 0, sy = 0;
  let box = null;

  function ensureBox(){
    if(box) return box;
    box = document.createElement("div");
    box.className = "me-select-rect";
    box.style.position = "fixed";
    box.style.zIndex = "999998";
    box.style.pointerEvents = "none";
    box.style.display = "none";
    box.style.border = "2px dashed rgba(60,120,255,.9)";
    box.style.background = "rgba(60,120,255,.12)";
    document.body.appendChild(box);
    return box;
  }

  function start(x,y){
    selOn = true;
    sx = x; sy = y;
    const b = ensureBox();
    b.style.display = "block";
    b.style.left = x + "px";
    b.style.top  = y + "px";
    b.style.width = "0px";
    b.style.height= "0px";
  }

  function move(x,y){
    if(!selOn) return;
    const x1 = Math.min(sx, x), y1 = Math.min(sy, y);
    const x2 = Math.max(sx, x), y2 = Math.max(sy, y);
    const b = ensureBox();
    b.style.left = x1 + "px";
    b.style.top  = y1 + "px";
    b.style.width = (x2-x1) + "px";
    b.style.height= (y2-y1) + "px";
  }

  function end(){
    if(!selOn) return;
    selOn = false;
    if(box) box.style.display = "none";
  }

  grid.addEventListener("pointerdown", (ev)=>{
    if(!ev.shiftKey) return;
    if(ev.button !== undefined && ev.button !== 0) return;
    if(ev.target && ev.target.closest && ev.target.closest(".placed-item")) return;

    start(ev.clientX, ev.clientY);
    try{ grid.setPointerCapture(ev.pointerId); }catch(_){}
    ev.preventDefault();
  });

  grid.addEventListener("pointermove", (ev)=>{ move(ev.clientX, ev.clientY); });
  grid.addEventListener("pointerup",   ()=>{ end(); });
  grid.addEventListener("pointercancel",()=>{ end(); });
})();

</script>

  function __clampInt(v, a, b){
    v = parseInt(v, 10);

      if(inpNum && hVal){

      if(numLabel) numLabel.textContent = "G:";

      }

    modal.style.display = "block";

    __positionNear(srcEl);

  function __hide(){
    if(!modal) return;
    modal.style.display = "none";
    modal.setAttribute("aria-hidden","true");
    __meMiniDimCtx.kind = null;
    __meMiniDimCtx.srcEl = null;
  }

  function __positionNear(el){
    try{
      const vw = window.innerWidth, vh = window.innerHeight;
      const cw = Math.max(220, card.offsetWidth || 260);
      const ch = Math.max(120, card.offsetHeight || 160);

      let left = 12, top = 120;
      if(el && el.getBoundingClientRect){
        const r = el.getBoundingClientRect();
        left = r.left + (r.width/2) - (cw/2);
        top  = r.bottom + 8;
        if(top + ch > vh - 8){
          top = r.top - ch - 8;
        }
      }
      left = Math.max(8, Math.min(vw - cw - 8, left));
      top  = Math.max(8, Math.min(vh - ch - 8, top));

      card.style.left = Math.round(left) + "px";
