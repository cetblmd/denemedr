<script id="oz-hit-sync-v298">
(function(){
  try{
    if(window.__ozHitSyncInstalled) return;
    window.__ozHitSyncInstalled = true;

    function getCatalog(){
      try{
        if(window.__ORTAK_MENU_V1 && Array.isArray(window.__ORTAK_MENU_V1.items)) return window.__ORTAK_MENU_V1.items;
      }catch(e){}
      try{
        if(Array.isArray(window.MenuItemsTanimlamalari)) return window.MenuItemsTanimlamalari;
      }catch(e){}
      return [];
    }

    function buildMap(){
      const m = new Map();
      const arr = getCatalog() || [];
      for(let i=0;i<arr.length;i++){
        const it = arr[i];
        if(!it) continue;
        const id = String(it.id||'').trim();
        if(!id) continue;
        if(!m.has(id)) m.set(id, it);
      }
      return m;
    }

    let __HIT_MAP = null;
    function map(){ if(!__HIT_MAP) __HIT_MAP = buildMap(); return __HIT_MAP; }

    function pickHit(it, fallbackId){
      try{
        var v = (it && (it.hit || it.desc || it.title || it.text || it.caption || it.name)) || fallbackId;
        v = (v == null) ? '' : String(v);
        return v.trim() || String(fallbackId||'').trim();
      }catch(e){
        try{ return String(fallbackId||'').trim(); }catch(_){ return ''; }
      }
    }

    function __ozBuildCatalogMap(){
      var map = Object.create(null);
      try{
        var items = (typeof __ozGetCatalogItems === 'function') ? __ozGetCatalogItems() : [];
        if(Array.isArray(items)){
          for(var i=0;i<items.length;i++){
            var it = items[i];
            if(!it) continue;
            var id = String(it.id||'').trim();
            if(!id) continue;
            map[id] = it;
          }
        }
      }catch(e){}
      return map;
    }

    window.__ozEdgePostHitSync = function(which){
      try{
        var id = String(which||'');
        var root = (id==='edgeLeft') ? document.getElementById('edgeLeftPreview')
                 : (id==='edgeRight') ? document.getElementById('edgeRightPreview')
                 : null;
        if(!root) return;

        var map = __ozBuildCatalogMap();
        var tiles = root.querySelectorAll('.placed-item, .edge-placed-item');
        for(var i=0;i<tiles.length;i++){
          var el = tiles[i];
          if(!el) continue;

          try{ el.style.setProperty('pointer-events','auto','important'); }catch(e){}

          var tid = (el.getAttribute('data-id') || el.getAttribute('data-item-id') || el.getAttribute('data-menu-id') || '').trim();
          if(!tid){
            try{
              var ds = el.dataset || {};
              tid = String(ds.id || ds.itemId || ds.itemid || ds.key || ds.menuId || ds.menuid || '').trim();
            }catch(e){}
          }
          if(!tid) continue;

          var it = map[tid] || null;
          var hit = pickHit(it, tid);
          try{ el.setAttribute('data-hit', hit); }catch(e){}
          try{ el.setAttribute('title', hit); }catch(e){}
        }
      }catch(e){
        try{ console.error('[OZ] hitSync failed', e); }catch(_){}
      }
    };

    function burstHook(){
      try{
        var old = window.__edgePreviewBurst;
        if(typeof old !== 'function') return;
        if(old.__ozWrapped) return;

        var wrapped = function(owner){
          var r = old.apply(this, arguments);
          try{ window.__ozEdgePostHitSync(owner); }catch(e){}
          return r;
        };
        wrapped.__ozWrapped = true;
        window.__edgePreviewBurst = wrapped;
      }catch(e){}
    }

    burstHook();
    (function(){
      function apply(root){
        try{
          if(!root) return;
          var map = (typeof __ozBuildCatalogMap==='function') ? __ozBuildCatalogMap() : {};
          var tiles = root.querySelectorAll('.placed-item, .edge-placed-item');
          for(var i=0;i<tiles.length;i++){
            var el = tiles[i];
            if(!el) continue;
            try{ el.style.setProperty('pointer-events','auto','important'); }catch(e){}
            var tid = '';
            try{ tid = String(el.getAttribute('data-id')||el.getAttribute('data-item-id')||'').trim(); }catch(e){}
            if(!tid){
              try{
                var ds = el.dataset || {};
                tid = String(ds.id || ds.itemId || ds.itemid || ds.key || ds.menuId || ds.menuid || '').trim();
              }catch(e){}
            }
            if(!tid) continue;
            var it = map[tid] || null;
            var hit = '';
            try{ hit = pickHit(it, tid); }catch(e){ hit = tid; }
            if(!hit){
              try{
                var t = el.querySelector('.title');
                hit = (t && (t.getAttribute('title')||t.textContent)) ? String(t.getAttribute('title')||t.textContent).trim() : tid;
              }catch(e){ hit = tid; }
            }
            try{ el.setAttribute('data-hit', hit); }catch(e){}
            try{ el.setAttribute('title', hit); }catch(e){}
          }
        }catch(e){}
      }
      function watch(id){
        try{
          var root = document.getElementById(id);
          if(!root) return;
          apply(root);
          var mo = new MutationObserver(function(){
            apply(root);
          });
          mo.observe(root, { childList:true, subtree:true });
        }catch(e){}
      }
      try{ watch('edgeLeftPreview'); }catch(e){}
      try{ watch('edgeRightPreview'); }catch(e){}
    })();

    setTimeout(function(){
      try{ window.__ozEdgePostHitSync('edgeLeft'); }catch(e){}
      try{ window.__ozEdgePostHitSync('edgeRight'); }catch(e){}
    }, 250);

  }catch(e){}
})();
</script>

function cfgGetRaw(baseKey) {

    try {
        const k = uKey(baseKey);
        const v = localStorage.getItem(k);
        if (v !== null) {
            if (typeof v === "string" && v.trim() === "") return null;
            return v;
        }
    } catch (e) { alert("catch3"+e); }

    try {
        const byP = window.__HBYS_CONFIG_V1_BY_PERSONEL;
        if (byP && byP[PERSONEL_ID] && typeof byP[PERSONEL_ID][baseKey] !== "undefined") {
            const v = byP[PERSONEL_ID][baseKey];
            if (typeof v === "string" && v.trim() === "") return null;
            return (typeof v === "string") ? v : JSON.stringify(v);
        }
        const g = window.__HBYS_CONFIG_V1;
        if (g && typeof g[baseKey] !== "undefined") {
            const v = g[baseKey];
            if (typeof v === "string" && v.trim() === "") return null;
            return (typeof v === "string") ? v : JSON.stringify(v);
        }
    } catch (e) { alert("catch2"+e); }

    return null;
}

function cfgSetRaw(baseKey, rawValue) {

    const persist = (window.__HBYS_PERSIST_TO_LOCALSTORAGE !== false);
    try {
        if (persist) localStorage.setItem(uKey(baseKey), rawValue);
    } catch (e) { alert("catch4"+e); }

    try {
        if (window.__HBYS_CONFIG_V1_BY_PERSONEL) {
            if (!window.__HBYS_CONFIG_V1_BY_PERSONEL[PERSONEL_ID]) window.__HBYS_CONFIG_V1_BY_PERSONEL[PERSONEL_ID] = {};
            window.__HBYS_CONFIG_V1_BY_PERSONEL[PERSONEL_ID][baseKey] = rawValue;
        }
    } catch (e) {  }

    try {
        if (window.__HBYS_CONFIG_V1 && typeof window.__HBYS_CONFIG_V1 === "object") {
            window.__HBYS_CONFIG_V1[baseKey] = rawValue;
        }
    } catch (e) {  }

    try {
        if (typeof window.__HBYS_SAVE_CONFIG === "function") {
            window.__HBYS_SAVE_CONFIG(PERSONEL_ID, baseKey, rawValue);

    } catch (e) { alert("catch5"+e); }
}

function loadSolConfigForActiveMode(){
  let block = null;
  try{
    const multi = (typeof loadSolRawMultiConfig === "function") ? loadSolRawMultiConfig() : { desktop:null, tablet:null, mobile:null };
    const cand = multi ? (multi[ACTIVE_MODE] ?? multi.desktop) : null;
    if (Array.isArray(cand)) block = cand;
  }catch(e){
    try{ console.error("[OZ] loadSolConfigForActiveMode parse failed", e); }catch(_){}
  }

  if (!Array.isArray(block)) block = getDefaultSolConfigArray();

  const defs = (typeof __ozGetPanelDefs === "function") ? __ozGetPanelDefs() : [];
  const known = new Set(defs.map(p=>String(p.id)));
  const out = [];

  for (const it of block){
    const id = (it && typeof it === "object") ? it.id : it;
    if (!id) continue;
    const sid = String(id);
    if (!known.has(sid)) continue;
    const enabled = (it && typeof it === "object" && "enabled" in it) ? !!it.enabled : true;
    const acikDurum = (it && typeof it === "object" && "acikDurum" in it) ? !!it.acikDurum : false;
    const isDefault = (it && typeof it === "object" && "isDefault" in it) ? !!it.isDefault : false;
    out.push({ id: sid, enabled, isDefault, acikDurum });
  }

  const existing = new Set(out.map(x=>String(x.id)));
  defs.forEach((p, idx)=>{
    const sid = String(p.id);
    if (existing.has(sid)) return;
    out.push({ id: sid, enabled: true, isDefault: idx===0, acikDurum: idx===0 });
  });

  // normalize default
  let sawDefault = false;
  for (const it of out){
    if (it.isDefault && !sawDefault){ sawDefault = true; continue; }
    if (it.isDefault && sawDefault) it.isDefault = false;
  }
  if (!sawDefault && out.length){
    out[0].isDefault = true;
  }
  return out;
}

function readSolConfigFromDOM(){
  if (!panelListEl) return getDefaultSolConfigArray();
  const base = (window.__solRuntimeConfig && Array.isArray(window.__solRuntimeConfig))
    ? window.__solRuntimeConfig.map(x=>({ ...x }))
    : loadSolConfigForActiveMode();

  const map = new Map(base.map(x=>[String(x.id), x]));
  const lis = Array.from(panelListEl.querySelectorAll("li.panel-item"));
  lis.forEach(li=>{
    const id = String(li.dataset.id || "");
    if (!id || !map.has(id)) return;
    const obj = map.get(id);
    const en = li.querySelector("input.panel-enabled-checkbox");
    const op = li.querySelector("input.panel-open-checkbox");
    obj.enabled = en ? !!en.checked : true;
    obj.acikDurum = op ? !!op.checked : false;
  });
  return Array.from(map.values());
}

function __solUpdateRuntime(id, patch){
  try{
    const arr = (window.__solRuntimeConfig && Array.isArray(window.__solRuntimeConfig)) ? window.__solRuntimeConfig : null;
    if(!arr) return;
    const sid = String(id);
    for(let i=0;i<arr.length;i++){

      if(!it) continue;
      if(String(it.id)===sid){
        Object.assign(it, patch || {});
        return;
      }
    }
  }catch(e){
    try{ console.error('[OZ] __solUpdateRuntime failed', e, {id}); }catch(_){ }
  }
}

function loadQuickConfigForActiveMode() {

    let parsed = null;
    try {
        const raw = cfgGetRaw(QUICK_STORAGE_KEY);
        if (raw) parsed = JSON.parse(raw);
        parsed = (parsed);
    } catch (e) {
        parsed = null;
    }

    let block = null;

    if (Array.isArray(parsed)) {
        block = { items: parsed, align: getDefaultQuickAlign(), barVisible: true };
    } else if (parsed && typeof parsed === 'object') {
        const cand = parsed[ACTIVE_MODE] ?? parsed.desktop ?? parsed.tablet ?? parsed.mobile ?? null;
        if (cand && typeof cand === 'object' && !Array.isArray(cand) && Array.isArray(cand.items)) {
            block = {
                items: cand.items,
                align: cand.align || getDefaultQuickAlign(),
                barVisible: (cand.barVisible !== false)
            };
        } else if (Array.isArray(cand)) {
            block = { items: cand, align: getDefaultQuickAlign(), barVisible: true };
        }
    }

    if (!block) {
        block = { items: getDefaultQuickConfigArray(), align: getDefaultQuickAlign(), barVisible: true };
    }

    const known = new Set(__ozGetQuickDefs().map(q => q.id));
    const out = [];
    for (const it of (block.items || [])) {
        const id = (it && typeof it === 'object') ? it.id : it;
        if (!id || !known.has(id)) continue;
        out.push({ id, visible: (it && typeof it === 'object' && 'visible' in it) ? !!it.visible : true });
    }

    const existing = new Set(out.map(x => x.id));
    for (const q of __ozGetQuickDefs()) {
        if (!existing.has(q.id)) out.push({ id: q.id, visible: true });
    }

    return { items: out, align: block.align || getDefaultQuickAlign(), barVisible: (block.barVisible !== false) };
}

function __quickUpdateRuntime(id, patch){
  try{
    const sid = String(id||"");
    if(!sid) return;
    const base = (window.__quickRuntimeCfg && typeof window.__quickRuntimeCfg==="object") ? window.__quickRuntimeCfg : (typeof loadQuickConfigForActiveMode==="function" ? loadQuickConfigForActiveMode() : null);
    const cfg = (base && typeof base==="object") ? base : { items: [], align: getDefaultQuickAlign(), barVisible: true };
    const arr = Array.isArray(cfg.items) ? cfg.items.slice() : [];
    const out = [];
    let hit = false;
    for(const it of arr){
      if(it && typeof it==="object"){
        const iid = String(it.id||"");
        if(iid===sid){ out.push(Object.assign({}, it, patch||{}, { id:sid })); hit = true; }
        else out.push(Object.assign({}, it, { id:iid }));
      }else{
        const iid = String(it||"");
        if(iid===sid){ out.push(Object.assign({}, patch||{}, { id:sid })); hit = true; }
        else if(iid) out.push({ id:iid, visible:true });
      }
    }
    if(!hit) out.push(Object.assign({}, patch||{}, { id:sid }));
    cfg.items = out;
    window.__quickRuntimeCfg = cfg;
  }catch(e){ try{ console.error("[OZ] __quickUpdateRuntime failed", e); }catch(_){ } }
}

function __ozInstallListReorder(listEl, kind){
  if(!listEl || listEl.__ozReorderInstalled) return;
  listEl.__ozReorderInstalled = true;
  let draggingEl = null;
  const getItemEl = (t)=>{ try{ return t ? t.closest('li') : null; }catch(_){ return null; } };
  const finish = ()=>{
    if(!draggingEl) return;
    try{ draggingEl.classList.remove('oz-dragging'); }catch(_){}
    let ids = [];
    try{ ids = Array.from(listEl.querySelectorAll('li')).map(li=>String(li.dataset.id||'')).filter(Boolean); }catch(_){}
    try{
      if(kind==='sol'){
        const cur = Array.isArray(window.__solRuntimeConfig) ? window.__solRuntimeConfig : ((typeof loadSolConfigForActiveMode==='function') ? (loadSolConfigForActiveMode()||[]) : []);
        const map = new Map(cur.map(o=>[String(o&&o.id||''), o]));
        const out = [];
        ids.forEach(id=>{ const o = map.get(id); if(o){ out.push(o); map.delete(id); } });
        cur.forEach(o=>{ const id=String(o&&o.id||''); if(id && map.has(id)) out.push(o); });
        window.__solRuntimeConfig = out;
        try{ saveSolConfigForActiveMode(out); }catch(_){}
        try{ renderSolList(out); }catch(_){}
      }else if(kind==='quick'){
        const qc = (typeof loadQuickConfigForActiveMode==='function') ? (loadQuickConfigForActiveMode()||null) : null;
        const items = (qc && Array.isArray(qc.items)) ? qc.items : (typeof getDefaultQuickConfigArray==='function' ? getDefaultQuickConfigArray() : []);
        const align = (qc && qc.align) ? qc.align : (typeof getDefaultQuickAlign==='function' ? getDefaultQuickAlign() : 'left');
        const barVisible = (qc && typeof qc.barVisible==='boolean') ? qc.barVisible : true;
        const map = new Map(items.map(o=>[String(o&&o.id||''), o]));
        const out = [];
        ids.forEach(id=>{ const o = map.get(id); if(o){ out.push(o); map.delete(id); } });
        items.forEach(o=>{ const id=String(o&&o.id||''); if(id && map.has(id)) out.push(o); });
        try{ saveQuickConfigForActiveMode(out, align, barVisible); }catch(_){}
        try{ renderQuickList({ items: out, align, barVisible }); }catch(_){}
      }
    }catch(_){}
    try{ document.documentElement.classList.remove('oz-dragging-body'); document.body.classList.remove('oz-dragging-body'); }catch(_){ }
    draggingEl = null;
  };
  listEl.addEventListener('pointerdown', (e)=>{
    const h = e.target && e.target.closest ? e.target.closest('.drag-handle') : null;
    if(!h) return;
    const li = getItemEl(h);
    if(!li || !listEl.contains(li)) return;
    draggingEl = li;
    try{ draggingEl.classList.add('oz-dragging'); }catch(_){}
    try{
      if(e.pointerId!=null && listEl.setPointerCapture) listEl.setPointerCapture(e.pointerId);
    }catch(_){}
    try{
      document.documentElement.classList.add('oz-dragging-body');
      document.body.classList.add('oz-dragging-body');
    }catch(_){}
    try{ e.preventDefault(); e.stopPropagation(); }catch(_){}
  }, {capture:true});
  listEl.addEventListener('pointermove', (e)=>{
    if(!draggingEl) return;
    try{ e.preventDefault(); e.stopPropagation(); }catch(_){}
    let li = null;
    try{
      const el = (document.elementFromPoint && typeof e.clientX==='number' && typeof e.clientY==='number') ? document.elementFromPoint(e.clientX, e.clientY) : e.target;
      li = getItemEl(el);
    }catch(_){ li = getItemEl(e.target); }
    if(!li || li===draggingEl || !listEl.contains(li)) return;
    try{
      const rect = li.getBoundingClientRect();
      const before = (typeof e.clientY==='number') ? (e.clientY < rect.top + rect.height/2) : true;
      if(before) listEl.insertBefore(draggingEl, li);
      else listEl.insertBefore(draggingEl, li.nextSibling);
    }catch(_){}
  }, {capture:true});
  listEl.addEventListener('pointerup', ()=>{ finish(); }, {capture:true});
  listEl.addEventListener('pointercancel', ()=>{ finish(); }, {capture:true});
  listEl.addEventListener('mouseleave', ()=>{ finish(); });
}


function readQuickConfigFromDOM() {
    if (!quickListEl) return getDefaultQuickConfigArray();

    const base = (window.__quickRuntimeCfg && Array.isArray(window.__quickRuntimeCfg.items))
        ? window.__quickRuntimeCfg.items.map(x => ({ ...x }))
        : getDefaultQuickConfigArray();

    const map = new Map(base.map(x => [String(x.id), x]));

    const lis = Array.from(quickListEl.querySelectorAll('li.qa-item'));
    lis.forEach(li => {
        const id = String(li.dataset.id || '');
        if (!id) return;
        const chk = li.querySelector('.qa-visible-checkbox');
        const obj = map.get(id) || { id, visible: false };
        obj.visible = !!(chk && chk.checked);
        map.set(id, obj);
    });

    const seen = new Set(base.map(x => String(x.id)));
    for (const [id, obj] of map.entries()) {
        if (!seen.has(String(id))) base.push(obj);
    }

    window.__quickRuntimeCfg = window.__quickRuntimeCfg || { items: base, align: getDefaultQuickAlign(), barVisible: true };
    window.__quickRuntimeCfg.items = base;

    return base;
}

function __edgeStateToIdsSafe(state){
  try{
    if(!state) return [];
    const out = [];
    const push = (id)=>{
      if(id==null) return;
      const k = String(id);
      if(!out.includes(k)) out.push(k);
    };

    if(Array.isArray(state.placements)){
      state.placements.forEach(p=>{
        if(Array.isArray(p) && p.length) push(p[0]);
        else if(p && typeof p==='object' && ('id' in p)) push(p.id);
      });
      if(out.length) return out;
    }

    if(Array.isArray(state.order)){
      state.order.forEach(push);
      if(out.length) return out;
    }

    if(Array.isArray(state.items)){
      state.items.forEach(x=>{
        if(!x) return;
        if(typeof x==='string') push(x);
        else if(typeof x==='object') push(x.id || x.key);
      });
      if(out.length) return out;
    }

    if(state.catalog && typeof state.catalog==='object'){
      Object.keys(state.catalog).forEach(push);
      if(out.length) return out;
    }

    if(Array.isArray(state) && state.length && Array.isArray(state[0])){
      state.forEach(p=> push(p && p[0]));
      if(out.length) return out;
    }

    return out;
  }catch(e){ return []; }
}

function __canonItemId(id, silent){

      return id.slice(3);
    }
    return id;
}

  const pushUnique = (area, id)=>{
    if(id==null) return;
    const k = String(id);
    if(!k) return;
    if(allowed && !allowed.has(k)) return;

  try{

    const qitems = (qcfg && Array.isArray(qcfg.items)) ? qcfg.items : [];

  try{
    const stL = (window.__edgeLeftMenuDraft!=null) ? window.__edgeLeftMenuDraft : ((typeof loadEdgeLeftMenuState==='function') ? loadEdgeLeftMenuState(ACTIVE_MODE) : null);
    (__edgeStateToIdsSafe(stL)||[]).forEach(id => pushUnique('menuLeft', id));
  }catch(e){}

  try{
    const stR = (window.__edgeRightMenuDraft!=null) ? window.__edgeRightMenuDraft : ((typeof loadEdgeRightMenuState==='function') ? loadEdgeRightMenuState(ACTIVE_MODE) : null);
    (__edgeStateToIdsSafe(stR)||[]).forEach(id => pushUnique('menuRight', id));
  }catch(e){}

  return out;
}

function __ozBuildPlacementsForMenuEditor(){
  const out = { leftPanel: [], quickAccess: [], menuLeft: [], menuRight: [] };
  const pushUnique = (area, id)=>{
    if(!id) return;

<script>


function __ozEdgePostHitSync(grid, getItemById){
  try{
    if(!grid) return;
    if(typeof getItemById!=="function") return;

    var nodes = null;
    try{
      nodes = grid.querySelectorAll('.placed-item,.edge-placed-item,[data-id],[data-item-id],[data-key],[data-menu-id]');
    }catch(e){
      try{ console.error('[OZ] __ozEdgePostHitSync selector fail', e); }catch(_){}
      return;
    }
    if(!nodes || !nodes.length) return;

    function pickId(el){
      try{
        if(!el || el.nodeType!==1) return null;
        var id = el.getAttribute('data-id') || el.getAttribute('data-item-id') || el.getAttribute('data-key') || el.getAttribute('data-menu-id');
        if(!id && el.dataset){
          id = el.dataset.id || el.dataset.itemId || el.dataset.key || el.dataset.menuId;
        }
        if(!id) return null;
        id = String(id).trim();
        return id || null;
      }catch(e){ return null; }
    }

    function pickHit(item){
      try{
        if(!item) return null;
        var h = item.hit || item.desc || item.description || item.title || item.text || item.caption || item.name;
        if(h==null) return null;
        h = String(h).trim();
        return h || null;
      }catch(e){ return null; }
    }

    for(var i=0;i<nodes.length;i++){
      var n = nodes[i];
      if(!n || n.nodeType!==1) continue;

      var host = null;
      try{ host = n.closest ? n.closest('.placed-item,.edge-placed-item') : null; }catch(e){ host=null; }
      if(!host) host = n;

      try{ host.style.pointerEvents = 'auto'; }catch(e){}

      var id = pickId(host) || pickId(n);
      if(!id) continue;

      var item = null;
      try{ item = getItemById(id); }catch(e){ item=null; }

      var hit = pickHit(item) || id;
      try{
        host.setAttribute('data-hit', hit);
        host.setAttribute('title', hit);
      }catch(e){}
    }
  }catch(e){
    try{ console.error('[OZ] __ozEdgePostHitSync failed', e); }catch(_){}
  }
}


function __ozToPlacementsMap(state, items){
  const mp = new Map();
  const num = (v)=>{
    if(v==null) return NaN;
    if(typeof v === "number") return v;
    const s = String(v).trim();
    if(!s) return NaN;
    if(s.endsWith("px")) return parseFloat(s);
    const n = parseFloat(s);
    return Number.isFinite(n) ? n : NaN;
  };

  try{
    if(state && Array.isArray(state.placements) && state.placements.length){
      state.placements.forEach(p=>{
        if(!p || !p[0] || !p[1]) return;
        const id = String(p[0]);
        const pos = p[1] || {};
        const x = num(pos.x ?? pos.left);
        const y = num(pos.y ?? pos.top);
        if(Number.isFinite(x) || Number.isFinite(y)){
          mp.set(id, { x: Number.isFinite(x) ? x : 0, y: Number.isFinite(y) ? y : 0 });
        }else{
          mp.set(id, { r: (pos.r|0), c: (pos.c|0) });
        }
      });
      return mp;
    }
  }catch(_){}

  try{
    const arr = Array.isArray(state && state.order) ? state.order : [];
    if(arr && arr.length){
      arr.forEach((id,idx)=>{ if(id!=null) mp.set(String(id), { r: idx*4, c: 0 }); });
      return mp;
    }
  }catch(_){}

  try{
    (items||[]).forEach((it,idx)=>{ if(it && it.id) mp.set(String(it.id), { r: idx*4, c: 0 }); });
  }catch(_){}
  return mp;
}

    function renderOne(which){

(function(){
  function makeZoom(host, owner){
    if(!host) return null;

    const ZS = (window.__OZ_EDGE_ZOOM_STATE = window.__OZ_EDGE_ZOOM_STATE || {});
    const Z = {
      val: 1,
      MIN: 0.6,
      MAX: 1.6,
      STEP: 0.1
    };

    const __owner = (owner || (host.dataset && host.dataset.edgeZoomOwner) || 'ozellestirZoom');
    if(ZS[__owner]!=null){
      const vv = parseFloat(ZS[__owner]);
      if(Number.isFinite(vv)) Z.val = vv;
    }
    try{ if(host.dataset) host.dataset.edgeZoomOwner = __owner; }catch(_){}

    let which = '';
    try{
      const o = String(__owner||'');
      if(o.endsWith('_R')) which = 'right';
      else if(o.endsWith('_L')) which = 'left';
    }catch(_){}
    if(!which){
      try{
        const hid = String(host.id||'').toLowerCase();
        which = hid.includes('right') ? 'right' : 'left';
      }catch(_){ which='left'; }
    }

    let slot = null;
    try{
      slot = document.getElementById(which==='right' ? 'edgeRightZoomSlot' : 'edgeLeftZoomSlot');
    }catch(_){}
    if(!slot) slot = host;

    let scale = host.querySelector('.edge-zoom-scale');
    if(!scale){
      scale = document.createElement('div');
      scale.className = 'edge-zoom-scale';
      scale.style.transformOrigin = 'top left';
      const kids = Array.from(host.childNodes);
      kids.forEach(n=>{
        if(n && n.nodeType===1 && n.classList && n.classList.contains('edge-zoom-scale')) return;
        if(n && n.nodeType===1 && n.classList && n.classList.contains('edge-zoom-toolbar')) return;
        scale.appendChild(n);
      });
      host.appendChild(scale);
    }

    let bar = slot.querySelector('.edge-zoom-toolbar');
    if(!bar){
      bar = document.createElement('div');
      bar.className = 'edge-zoom-toolbar oz-edge-zoom-toolbar';
      bar.dataset.edgeZoomOwner = __owner;
      bar.style.cssText = 'display:flex;gap:6px;align-items:center;background:rgba(255,255,255,25);border:1px solid rgba(0,0,0,18);border-radius:10px;padding:4px 6px;font-size:12px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)';
      bar.innerHTML = '<button type="button" class="edge-zoom-btn" data-dir="-">−</button><span class="edge-zoom-label">100%</span><button type="button" class="edge-zoom-btn" data-dir="+">+</button>';
      try{ slot.appendChild(bar); }catch(_){}
      bar.addEventListener('click', (ev)=>{
        try{ ev.preventDefault(); ev.stopPropagation(); }catch(_){ }
        const btn = ev.target && ev.target.closest ? ev.target.closest('.edge-zoom-btn') : null;
        if(!btn) return;
        const dir = btn.getAttribute('data-dir');
        if(dir==='log'){
          try{ __ozDumpEdgeTiles(which||suf||__owner, host); }catch(e){ try{ console.warn('[OZ] dump failed', e); }catch(_){ } }
          return;
        }
        if(dir==='+') Z.val = Math.min(Z.MAX, +(Z.val + Z.STEP).toFixed(2));
        if(dir==='-') Z.val = Math.max(Z.MIN, +(Z.val - Z.STEP).toFixed(2));
        ZS[__owner] = Z.val;
        apply();
      });
    }else{
      try{ bar.className = 'edge-zoom-toolbar oz-edge-zoom-toolbar'; }catch(_){}
      try{ bar.dataset.edgeZoomOwner = __owner; }catch(_){}
    }

    function apply(){
      const lbl = bar ? bar.querySelector('.edge-zoom-label') : null;
      if(scale){
        scale.style.transformOrigin = '0 0';
        scale.style.transform = 'scale(' + Z.val.toFixed(2) + ')';
}
      if(lbl) lbl.textContent = Math.round(Z.val*100) + '%';
    }

    apply();
    return host;
  }

  function ensure(host, which){
    // which: "L" / "R" / any string for owner suffix
    const suf = (which!=null ? String(which) : '');
    const owner = 'ozellestirZoom' + (suf ? ('_' + suf) : '');
    return makeZoom(host, owner);
  }

  window.__edgeEnsurePreviewZoomUI = ensure;
  window.__ozEnsureEdgeZoomUI = ensure;
})();

function __edgeClearStorage(){
  try{
    const baseKeys = [
      'edgeLeftMenuState','edgeRightMenuState',

      'edgeLeftMenuState__desktop','edgeLeftMenuState__tablet','edgeLeftMenuState__mobile',
      'edgeRightMenuState__desktop','edgeRightMenuState__tablet','edgeRightMenuState__mobile',
      'edgeLeftConfig','edgeRightConfig',
      '__edgeLeftMenuDraft','__edgeRightMenuDraft'
    ];

    baseKeys.forEach(baseKey=>{
      try { localStorage.removeItem(baseKey); } catch(_){}
      try { localStorage.removeItem(uKey(baseKey)); } catch(_){}
    });

    try{
      if(window.__HBYS_CONFIG_V1_BY_PERSONEL && window.__HBYS_CONFIG_V1_BY_PERSONEL[PERSONEL_ID]){
        baseKeys.forEach(baseKey=>{
          try{ delete window.__HBYS_CONFIG_V1_BY_PERSONEL[PERSONEL_ID][baseKey]; }catch(_){}
        });
      }
    }catch(_){}
    try{
      if(window.__HBYS_CONFIG_V1){
        baseKeys.forEach(baseKey=>{
          try{ delete window.__HBYS_CONFIG_V1[baseKey]; }catch(_){}
        });
      }
    }catch(_){}

    try{ window.__edgeLeftMenuDraft = null; }catch(_){}
    try{ window.__edgeRightMenuDraft = null; }catch(_){}
    try{ window.__edgeLeftMenuDraftDirty = false; }catch(_){}
    try{ window.__edgeRightMenuDraftDirty = false; }catch(_){}
    try{ window.__edgeMenuDraftSide = null; }catch(_){}

    try{ sessionStorage.clear(); }catch(_){}
  }catch(e){}
}

(function(){

      location.replace(url);
    }
  }catch(e){}

function __edgeHexToRgb(hex){
    try{
        if(!hex) return null;
        const h = String(hex).replace("#","").trim();
        if(h.length===3){
            const r=parseInt(h[0]+h[0],16), g=parseInt(h[1]+h[1],16), b=parseInt(h[2]+h[2],16);
            return {r,g,b};
        }
        if(h.length!==6) return null;
        const r=parseInt(h.slice(0,2),16), g=parseInt(h.slice(2,4),16), b=parseInt(h.slice(4,6),16);
        if([r,g,b].some(n=>Number.isNaN(n))) return null;
        return {r,g,b};
    }catch(e){ return null; }
}

function __edgeGetTileSizeForMode(state, id, mode, fallbackW, fallbackH){
  try{
    const mKey = __edgeModeToMenuKey(mode);
    const st = state && state.tileStyles && state.tileStyles[id] ? state.tileStyles[id] : null;
    if(!st) return { wPx: fallbackW, hPx: fallbackH };

    const readDim = (v, fallback)=>{
      if(v == null) return fallback;
      if(typeof v === "number") return (v>0 ? v : fallback);
      if(typeof v === "string") { const n=parseInt(v,10); return (n>0 ? n : fallback); }
      if(typeof v === "object"){
        const vv = v[mKey] ?? v[mode] ?? v.desktop ?? v.pc ?? v.tablet ?? v.mobile;
        if(vv == null) return fallback;
        const n = (typeof vv==="number") ? vv : parseInt(String(vv),10);
        return (n>0 ? n : fallback);
      }
      return fallback;
    };

    const wPx = readDim(st.wPx, fallbackW);
    const hPx = readDim(st.hPx, fallbackH);
    return { wPx, hPx };
  }catch(e){
    return { wPx: fallbackW, hPx: fallbackH };
  }
}

</script>

<script>
(function(){
  function buildCatalogMap(){
    try{
      var items = (typeof __ozGetCatalogItems==="function") ? (__ozGetCatalogItems()||[]) : [];
      var m = Object.create(null);
      for(var i=0;i<items.length;i++){
        var it = items[i];
        if(!it) continue;
        var id = String(it.id||"").trim();
        if(!id) continue;
        m[id]=it;
      }
      return m;
    }catch(e){ return Object.create(null); }
  }

  var __ozEdgeCatalogMap = null;
  function getHitTextById(id){
    try{
      if(!id) return "";
      if(!__ozEdgeCatalogMap) __ozEdgeCatalogMap = buildCatalogMap();
      var it = __ozEdgeCatalogMap[id];
      if(!it) return "";
      var t = it.hit || it.desc || it.title || it.text || it.caption || "";
      return String(t||"").trim();
    }catch(e){ return ""; }
  }

  function syncRoot(root){
    try{
      if(!root) return;
      var nodes = root.querySelectorAll('.placed-item, .edge-placed-item');
      for(var i=0;i<nodes.length;i++){
        var el = nodes[i];
        if(!el || !el.getAttribute) continue;
        try{ el.style.setProperty('pointer-events','auto','important'); }catch(_){}
        var id = (el.getAttribute('data-id')||el.getAttribute('data-item-id')||"").trim();
        var hit = getHitTextById(id);
        if(!hit){
          var tEl = el.querySelector('.title');
          if(tEl){
            hit = String(tEl.textContent||"").trim();
          }
        }
        if(hit){
          try{ el.setAttribute('data-hit', hit); }catch(_){}
          try{ el.setAttribute('title', hit); }catch(_){}
        }
      }
    }catch(e){
      try{ console.error('[OZ] hitSync syncRoot failed', e); }catch(_){}
    }
  }

  function watchRoot(root){
    try{
      if(!root || root.__ozHitObs) return;
      var obs = new MutationObserver(function(){
        syncRoot(root);
      });
      obs.observe(root, {subtree:true, childList:true, attributes:true, attributeFilter:['style','class','data-id','data-item-id']});
      root.__ozHitObs = obs;
      syncRoot(root);
    }catch(e){}
  }

  function tryAttach(){
    try{
      var l = document.getElementById('edgeLeftPreview');
      var r = document.getElementById('edgeRightPreview');
      if(l) watchRoot(l);
      if(r) watchRoot(r);
    }catch(e){}
  }

  try{
    var orig = window.__edgePreviewBurst;
    if(typeof orig === 'function' && !orig.__ozWrapped){
      window.__edgePreviewBurst = function(){
        var res = orig.apply(this, arguments);
        tryAttach();
        return res;
      };
      window.__edgePreviewBurst.__ozWrapped = 1;
    }
  }catch(e){}

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', tryAttach);
  }else{
    tryAttach();
  }
})();
</script>

    return h.closest('.sol-row,.qa-row,.quick-row,.item-row,.list-row,li,div');

  function clear(){
    document.body.classList.remove('oz-dragging');
    document.querySelectorAll('.is-dragging').forEach(function(el){el.classList.remove('is-dragging');});
  }
  document.addEventListener('pointerdown', function(e){
    var h = e.target && e.target.closest ? e.target.closest('.drag-handle') : null;
    if(!h) return;
    var row = findRowFromHandle(h);
    if(row) row.classList.add('is-dragging');
    document.body.classList.add('oz-dragging');
  }, true);
  document.addEventListener('pointerup', clear, true);
  document.addEventListener('pointercancel', clear, true);
  window.addEventListener('blur', clear, true);
})();
